[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-first-ide"
version = "0.1.0"
description = "Dual-model LangGraph browser automation orchestrator with Supervisor + Worker VLM architecture."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "SandeepAi369" },
]
keywords = ["langgraph", "browser-automation", "playwright", "ai-agent"]

dependencies = [
    "pydantic>=2.12.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-google-genai>=2.1.0",
    "langsmith>=0.4.0",
    "playwright>=1.55.0",
    "playwright-stealth>=2.0.0",
    "python-dotenv>=1.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "mypy>=1.15",
    "ruff>=0.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110
fix = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# tests/live needs real accounts, API keys or network — run explicitly: pytest tests/live/<file>
norecursedirs = ["live", ".*", "*.egg", "build", "dist", "node_modules", "venv", "__pycache__"]
asyncio_mode = "auto"
